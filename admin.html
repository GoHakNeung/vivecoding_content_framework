<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>델파이 1차 응답 관리</title>
<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--panel:#eef1f3;--ink:#1c2228;--ink-2:#3a434c;--muted:#66707a;
  --line:#dcdcd5;--line-strong:#b9bdb9;--accent:#1d5c86;--accent-soft:#e3edf5;--on-accent:#ffffff;
  --head:#1f2a33;--head-ink:#f3f5f6;--head-muted:#b9c5ce;
  --warn:#b2501a;--warn-soft:#f8e6da;--ok:#2d7650;--ph:#fff2b8;--ph-ink:#5a4600;
  --c-content:#1d5c86;--c-cond:#6a4c93;--c-use:#3f7a5a;--c-gap:#b2501a;--c-main:#7a5b12;--c-ref:#66707a;
  --shadow:0 1px 2px rgba(20,30,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161a;--surface:#1a1f25;--panel:#20272e;--ink:#e5e9ec;--ink-2:#c6ccd2;--muted:#98a2ab;
  --line:#2d343b;--line-strong:#46505a;--accent:#7db4dc;--accent-soft:#1d2d3a;--on-accent:#0d1a24;
  --head:#0c1014;--head-ink:#eef2f4;--head-muted:#93a1ac;
  --warn:#f0a06b;--warn-soft:#3b2619;--ok:#79c99c;--ph:#4a3f12;--ph-ink:#ffe28a;
  --c-content:#7db4dc;--c-cond:#b9a0e0;--c-use:#8fcca9;--c-gap:#f0a06b;--c-main:#e0c36e;--c-ref:#98a2ab;
  --shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161a;--surface:#1a1f25;--panel:#20272e;--ink:#e5e9ec;--ink-2:#c6ccd2;--muted:#98a2ab;
  --line:#2d343b;--line-strong:#46505a;--accent:#7db4dc;--accent-soft:#1d2d3a;--on-accent:#0d1a24;
  --head:#0c1014;--head-ink:#eef2f4;--head-muted:#93a1ac;
  --warn:#f0a06b;--warn-soft:#3b2619;--ok:#79c99c;--ph:#4a3f12;--ph-ink:#ffe28a;
  --c-content:#7db4dc;--c-cond:#b9a0e0;--c-use:#8fcca9;--c-gap:#f0a06b;--c-main:#e0c36e;--c-ref:#98a2ab;
  --shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}
a{color:var(--accent)}
header.mast{background:var(--head);color:var(--head-ink);padding:34px 0 26px}
header.mast .kicker{margin:0 0 6px;font-size:.82rem;letter-spacing:.08em;color:var(--head-muted)}
header.mast h1{margin:0 0 10px;font-size:1.65rem;line-height:1.35;letter-spacing:-.01em}
header.mast .sub{margin:0;color:var(--head-muted);font-size:.92rem}
header.mast .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
header.mast .chips span{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:1px 10px;font-size:.8rem;color:var(--head-ink)}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:10px;min-width:210px}
.prog-num{font-size:.9rem;white-space:nowrap}
.prog-track{width:120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
#prog-fill{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.secnav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.secnav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:.84rem;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.secnav a:hover{border-color:var(--line-strong)}
@media (max-width:760px){.bar .wrap{gap:4px 12px}.prog{min-width:0;flex:1}.secnav{order:3;flex:1 1 100%;margin:0 -4px}}
.secnav a i{font-style:normal;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.secnav a.complete i{color:var(--ok);font-weight:700}
.scale-strip{border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);padding:3px 0}
.scale-strip .wrap{display:block;padding-top:0;padding-bottom:0}
.scale-strip b{color:var(--ink-2);margin:0 2px 0 8px}
.scale-strip b:first-of-type{margin-left:0}
main{padding-bottom:80px}
.sec{padding-top:12px}
h2{font-size:1.32rem;margin:44px 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 .num{font-size:.95rem;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:1px 9px;font-weight:700}
h2 small,h3 small{font-size:.8rem;font-weight:400;color:var(--muted)}
h3{font-size:1.06rem;margin:26px 0 8px}
h3.sub{margin-top:30px;padding-left:10px;border-left:3px solid var(--accent)}
h4{font-size:.98rem;margin:16px 0 6px}
p{margin:8px 0}
.lead{font-size:1.02rem}
.sec-lead{color:var(--ink-2)}
.meta{font-size:.86rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:14px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--panel)}
.card h3{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin:0}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
ol.steps{padding-left:1.2em;margin:6px 0}
ol.steps li{margin:4px 0}
dl.scales dt{font-weight:700;margin-top:8px}
dl.scales dd{margin:0 0 0 0;color:var(--ink-2);font-size:.93rem}
ol.likert{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.8rem;text-align:center;color:var(--ink-2)}
ol.likert li{background:var(--panel);border-radius:8px;padding:6px 2px;line-height:1.35}
ol.likert b{display:block;font-size:1rem;color:var(--ink)}
.resp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.resp-grid{grid-template-columns:1fr}}
.resp label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--ink-2)}
.resp input[type=text],.resp select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;width:100%}
.resp label.consent{flex-direction:row;align-items:flex-start;gap:8px;margin-top:12px;font-size:.92rem;color:var(--ink)}
.resp label.consent input{margin-top:6px}
.ph{background:var(--ph);color:var(--ph-ink);padding:0 4px;border-radius:3px}
blockquote{margin:10px 0;padding:12px 16px;background:var(--surface);border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
blockquote.key{font-weight:600}
.premise{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 22px 16px}
.premise h3{display:flex;align-items:center;gap:8px}
.fig{margin:14px 0 10px}
.figscroll{overflow-x:auto}
.figscroll img{display:block;width:100%;min-width:640px;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.fig figcaption{font-size:.84rem;color:var(--muted);text-align:center;margin-top:6px}
.pn{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.82rem;align-items:center;justify-content:center;font-weight:700}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scope>div{background:var(--panel);border-radius:10px;padding:4px 14px}
.scope ul{padding-left:1.1em;margin:4px 0 10px;font-size:.93rem}
@media (max-width:760px){.scope{grid-template-columns:1fr}}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--surface)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--panel);font-weight:700;white-space:nowrap}
.tbl.small table{font-size:.84rem}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.item-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:start}
@media (max-width:760px){.item-main{grid-template-columns:1fr}}
.code{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);margin-right:8px;white-space:nowrap}
.item h4{margin:0 0 4px;font-size:1rem}
.stem{margin:0;font-weight:600}
.stmt{margin:0;color:var(--ink-2)}
.detail{margin:6px 0 0;font-size:.86rem;color:var(--muted)}
.detail b{color:var(--ink-2);font-weight:600}
.ihead{margin:0 0 4px}
.ititle{font-weight:700;color:var(--ink-2)}
.plain{margin:10px 0;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:.96rem}
.plain b{color:var(--accent);margin-right:6px}
.ex{display:block;margin-top:4px;font-size:.86rem;color:var(--muted)}
.gloss-card summary{cursor:pointer}
dl.gloss dt{font-weight:700;margin-top:10px}
dl.gloss dd{margin:2px 0 0;color:var(--ink-2);font-size:.93rem}
.legend-card .legend{margin:4px 0}
.tbl.glance td:first-child{white-space:nowrap;font-weight:700}
.open h3 small{font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
dl.scales dt small{font-weight:400;color:var(--muted);margin-left:6px}
.lvl{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.rates{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:760px){.rates{align-items:stretch}}
.rate{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rate-name{font-size:.8rem;color:var(--muted);white-space:nowrap}
.pills{display:inline-flex;gap:5px}
.pills label{position:relative;display:inline-flex;cursor:pointer}
.pills input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.pills span{min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:999px;font-size:.92rem;color:var(--ink-2);background:var(--surface);transition:background .15s,border-color .15s,color .15s;font-variant-numeric:tabular-nums}
.need .pills span{min-width:70px;padding:0 12px}
.pills label:hover span{border-color:var(--accent)}
.pills input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pills input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rate.missing .rate-name{color:var(--warn);font-weight:700}
.rate.missing .pills span{border-color:var(--warn)}
.item.missing,.domain.missing{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.tools{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.tools details{flex:1 1 100%}
details>summary{cursor:pointer;font-size:.86rem;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:.75rem;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>summary small{color:var(--muted)}
details.cmt textarea{margin-top:6px}
.item>details.cmt{margin-top:8px}
.ev-body{margin-top:8px;padding:10px 14px;background:var(--panel);border-radius:8px;font-size:.88rem}
.ev-body dl{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 12px;margin:0}
.ev-body dt{font-weight:700;color:var(--ink-2)}
.ev-body dd{margin:0}
@media (max-width:600px){.ev-body dl{grid-template-columns:1fr}.ev-body dt{margin-top:6px}}
.ev-cap{font-weight:700;margin:12px 0 4px}
details.wide{margin:12px 0}
.et{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 5px;line-height:1.5;margin-right:2px;vertical-align:1px}
.t-content{color:var(--c-content)}.t-cond{color:var(--c-cond)}.t-use{color:var(--c-use)}.t-gap{color:var(--c-gap)}.t-main{color:var(--c-main)}.t-ref{color:var(--c-ref)}
abbr.rc{text-decoration:none;font-size:.74rem;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;cursor:help}
.legend{font-size:.84rem;color:var(--muted);line-height:2}
.domain{margin:34px 0 10px;padding:16px 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.domain-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 24px;align-items:start}
@media (max-width:760px){.domain-head{grid-template-columns:1fr}}
.domain h3{margin:0 0 6px;font-size:1.15rem}
.layer{margin:0 0 2px;font-size:.76rem;letter-spacing:.06em;color:var(--muted)}
.ddef{margin:0;font-weight:600}
.dprin{margin:6px 0 0;font-size:.86rem;color:var(--ink-2)}
.domain .rate-name::after{content:" (대영역)"}
.item.mid{margin-left:18px}
@media (max-width:760px){.item.mid{margin-left:0}}
.open{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:14px 18px;margin:18px 0}
.open h3{margin:0 0 4px}
.open p{color:var(--ink-2);font-size:.94rem}
textarea{resize:vertical;min-height:72px;line-height:1.6}
.mirror{display:none}
.submit .big{font-size:1.3rem;margin:0 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.file{position:relative;overflow:hidden}
.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bar .btn{padding:5px 12px;font-size:.84rem}
.missing-list{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:.9rem}
.missing-list a{margin-right:8px;white-space:nowrap}
.missing-list.ok{background:var(--accent-soft)}
.status{font-size:.85rem;color:var(--muted);min-height:1.4em;margin:10px 0 0}
dl.abbr{display:grid;grid-template-columns:8em minmax(0,1fr);gap:4px 12px}
footer{border-top:1px solid var(--line);padding:16px 0 40px;font-size:.8rem;color:var(--muted)}
@media print{
  :root{--bg:#fff;--surface:#fff;--panel:#f3f3f3;--ink:#000;--ink-2:#222;--muted:#555;--line:#bbb;--line-strong:#888;--accent:#000;--accent-soft:#eee;--on-accent:#fff;--shadow:none}
  body{font-size:10.5pt;background:#fff}
  .bar,.no-print,.actions,.tools details.ev:not([open]),#missing,.status,.btn{display:none!important}
  header.mast{background:#fff;color:#000;padding:0 0 8px;border-bottom:2px solid #000}
  header.mast .kicker,header.mast .sub{color:#333}
  header.mast .chips span{border-color:#999;color:#000}
  .item,.domain,.open,.card,table{break-inside:avoid}
  .pills span{-webkit-print-color-adjust:exact;print-color-adjust:exact;min-width:26px;height:26px}
  .pills input:checked+span{background:#000!important;color:#fff!important}
  textarea{display:none}
  .mirror{display:block;white-space:pre-wrap;border:1px solid #bbb;border-radius:6px;padding:6px 8px;min-height:3em}
  details.cmt:not(.has-text){display:none}
  details>summary::before{content:""}
  h2{break-after:avoid}
}

[hidden]{display:none!important}
body[data-mode="gate"] .mast,body[data-mode="gate"] .bar,body[data-mode="gate"] main,body[data-mode="gate"] footer{display:none}
body:not([data-mode="gate"]) .gate{display:none}
body[data-mode="consent"] .bar,body[data-mode="consent"] #delphi{display:none}
body[data-mode="ready"] #consent{display:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box}
.gate-card{width:100%;max-width:580px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow)}
.gate-card .kicker{margin:0 0 6px;color:var(--muted);font-size:.86rem}
.gate-card h1{font-size:1.32rem;line-height:1.45;margin:0 0 6px}
.gate-card .sub{margin:0 0 14px;color:var(--ink-2);font-size:.92rem}
.gate-card .btn.primary{font-size:1rem;padding:11px 18px;margin-top:6px}
.gate-msg{min-height:1.4em;margin:12px 0 0;color:var(--warn);font-size:.9rem}
.inapp{margin-top:14px;padding:14px 16px;border:1px solid var(--warn);border-radius:10px;background:var(--warn-soft);font-size:.92rem}
.inapp b{display:block;margin-bottom:4px}
.inapp p{margin:4px 0}
.inapp .actions{margin-top:10px}
.inapp a.btn{text-decoration:none}
.inapp input{width:100%;box-sizing:border-box;margin-top:10px;font:inherit;font-size:.85rem;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
table.consent-table{width:100%;border-collapse:collapse;font-size:.92rem}
table.consent-table th{width:6.5em;text-align:left;vertical-align:top;padding:8px 10px;background:var(--panel);border:1px solid var(--line);font-weight:600;white-space:nowrap}
table.consent-table td{padding:8px 10px;border:1px solid var(--line)}
@media (max-width:600px){table.consent-table th{width:auto;white-space:normal}}
.consent-chk{display:flex;gap:8px;align-items:flex-start;margin:14px 0 10px}
.consent-chk input{margin-top:6px}
.cloud{font-size:.8rem;color:var(--muted);white-space:nowrap}
.cloud.on{color:var(--ok)}
.cloud.err{color:var(--warn);font-weight:700}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media print{.gate,#consent,.linkbtn{display:none!important}}

h1 small{font-size:.9rem;color:var(--muted);font-weight:400}
table.list{width:100%;border-collapse:collapse;font-size:.88rem}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.list th{background:var(--panel);white-space:nowrap}
.tablewrap{overflow-x:auto}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:.9rem}
</style>
</head>
<body data-mode="admin">
<main class="wrap">
<h1>델파이 검사(1차) 응답 관리 <small>연구자용</small></h1>
<p class="meta">응답 문서 모음: <code>delphi_r1</code> · 연구자 계정으로 로그인해야 응답을 볼 수 있습니다(Firestore 규칙). 이 주소는 패널에게 알리지 않습니다.</p>
<div class="card" id="signin-card"><button type="button" class="btn primary" id="signin">구글 계정으로 로그인</button><p class="status" id="msg" role="status" aria-live="polite"></p></div>
<div id="panel" hidden>
<div class="card"><p>로그인 계정: <b id="who"></b> · <button type="button" class="linkbtn" id="signout">로그아웃</button> · <button type="button" class="linkbtn" id="reload">새로 불러오기</button></p>
<p id="summary"></p>
<div class="actions"><button type="button" class="btn primary" id="dl-csv">원자료 내려받기(CSV)</button><button type="button" class="btn" id="dl-json">전체 백업(JSON)</button>
<label class="inline"><input type="checkbox" id="with-draft"> 작성 중(미제출) 응답도 넣기</label></div>
<p class="meta">원자료 CSV는 응답지의 '내 응답 파일로 받기'와 같은 열(응답자~문항)에 이메일·상태·제출시각·마지막저장·UID 열을 덧붙인 형식입니다. 응답 삭제(동의 철회 등)는 Firebase 콘솔에서 합니다.</p></div>
<div class="card tablewrap"><table class="list"><thead><tr><th>#</th><th>성명</th><th>패널 구분</th><th>이메일</th><th>상태</th><th>응답 칸</th><th>동의</th><th>마지막 저장</th><th>제출</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

// 연구자용 관리 화면(2026-11-02 시안). 읽기 권한은 Firestore 규칙이 연구자 계정에만 준다 — 이 파일에는 관리자 이메일을 넣지 않는다.
const CFG = {
  "apiKey": "AIzaSyDSkRgkBVWAsreiFmGE_j9oK0zAoB7oxZQ",
  "authDomain": "vivecode-content-framework.firebaseapp.com",
  "projectId": "vivecode-content-framework",
  "storageBucket": "vivecode-content-framework.firebasestorage.app",
  "messagingSenderId": "693152543190",
  "appId": "1:693152543190:web:37f958754a78aedccdf477"
};
const COL = "delphi_r1", HEAD = ["응답자", "패널구분", "저장시각", "구역", "문항ID", "척도", "응답값", "응답표기", "문항"], TOTAL = 63;
const app = initializeApp(CFG), auth = getAuth(app), db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
const $ = (id) => document.getElementById(id);
let docs = [];
const pad = (n) => (n < 10 ? "0" : "") + n;
function ts(v) {
  const d = v && v.toDate ? v.toDate() : (v ? new Date(v) : null);
  return d && !isNaN(d) ? d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) : "";
}
function csvEsc(s) { s = String(s == null ? "" : s); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function parseCSV(text) {
  text = String(text || "").replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text.charAt(i);
    if (q) {
      if (ch === '"') { if (text.charAt(i + 1) === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text.charAt(i + 1) === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function download(name, content, type) {
  const blob = new Blob([(type.indexOf("csv") >= 0 ? "﻿" : "") + content], { type: type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function fileStamp() { const d = new Date(); return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()); }
function render() {
  const sub = docs.filter((d) => d.status === "submitted").length, groups = {};
  docs.forEach((d) => { const g = (d.resp && d.resp.group) || "(미입력)"; groups[g] = (groups[g] || 0) + 1; });
  $("summary").textContent = "응답 문서 " + docs.length + "건(제출 " + sub + " · 작성 중 " + (docs.length - sub) + ") · 패널 구분: " +
    (Object.keys(groups).map((g) => g + " " + groups[g]).join(", ") || "없음");
  const tb = $("rows");
  tb.textContent = "";
  docs.forEach((d, i) => {
    const tr = document.createElement("tr");
    [i + 1, d.resp && d.resp.name, d.resp && d.resp.group, d.email, d.status === "submitted" ? "제출" : "작성 중",
     (d.answered == null ? "?" : d.answered) + " / " + TOTAL, d.consent ? ts(d.consent.at) : "", ts(d.updatedAt), ts(d.submittedAt)]
      .forEach((v) => { const td = document.createElement("td"); td.textContent = v == null ? "" : String(v); tr.appendChild(td); });
    tb.appendChild(tr);
  });
}
async function load() {
  $("msg").textContent = "불러오는 중…";
  try {
    const qs = await getDocs(collection(db, COL));
    docs = qs.docs.map((s) => Object.assign({ id: s.id }, s.data()));
    const key = (d) => (ts(d.firstSubmittedAt) || "9999") + ts(d.updatedAt);
    docs.sort((a, b) => key(a).localeCompare(key(b)));
    $("msg").textContent = "";
    $("signin-card").hidden = true;
    $("panel").hidden = false;
    render();
  } catch (e) {
    console.error(e);
    $("panel").hidden = true;
    $("signin-card").hidden = false;
    $("msg").textContent = e.code === "permission-denied"
      ? "이 계정에는 응답을 읽을 권한이 없습니다. 연구자 계정으로 로그인해 주십시오."
      : "불러오지 못했습니다(" + (e.code || "오류") + ").";
  }
}
function rawCSV() {
  const withDraft = $("with-draft").checked;
  const out = [HEAD.concat(["이메일", "상태", "제출시각", "마지막저장", "UID"])];
  docs.filter((d) => withDraft || d.status === "submitted").forEach((d) => {
    parseCSV(d.csv).slice(1).forEach((r) => {
      if (r.length >= HEAD.length) out.push(r.slice(0, HEAD.length).concat([d.email || "", d.status || "", ts(d.submittedAt), ts(d.updatedAt), d.id]));
    });
  });
  return out.map((r) => r.map(csvEsc).join(",")).join("\r\n");
}
function plain(v) {
  if (v && typeof v.toDate === "function") return v.toDate().toISOString();
  if (Array.isArray(v)) return v.map(plain);
  if (v && typeof v === "object") { const o = {}; Object.keys(v).forEach((k) => { o[k] = plain(v[k]); }); return o; }
  return v;
}
$("signin").addEventListener("click", async () => {
  $("msg").textContent = "";
  try { await signInWithPopup(auth, provider); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") $("msg").textContent = "로그인하지 못했습니다(" + (e.code || "오류") + ")."; }
});
$("signout").addEventListener("click", async () => { try { await signOut(auth); } catch (e) { /* 무시 */ } location.reload(); });
$("reload").addEventListener("click", load);
$("dl-csv").addEventListener("click", () => download("델파이1R_원자료_" + fileStamp() + ".csv", rawCSV(), "text/csv;charset=utf-8"));
$("dl-json").addEventListener("click", () => download("델파이1R_백업_" + fileStamp() + ".json", JSON.stringify(plain(docs), null, 2), "application/json"));
onAuthStateChanged(auth, (user) => {
  if (!user) { $("panel").hidden = true; $("signin-card").hidden = false; return; }
  $("who").textContent = user.email || "";
  load();
});
</script>
</body>
</html>
